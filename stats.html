<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shyfters Matching — Statistiques</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="styles.css?v=2">
  <style>
    .stats-wrap { max-width: 900px; margin: 0 auto; }

    /* KPI cards */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-bottom: 24px;
    }
    .kpi-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px 28px;
    }
    .kpi-value {
      font-size: 40px;
      font-weight: 700;
      line-height: 1;
      margin-bottom: 6px;
      color: var(--text);
    }
    .kpi-value.cyan  { color: var(--accent); }
    .kpi-value.green { color: #22C55E; }
    .kpi-label {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--muted);
    }

    /* Sections */
    .stats-section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px 28px;
      margin-bottom: 20px;
    }
    .stats-section-title {
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--muted);
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    /* Barres */
    .bar-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }
    .bar-label {
      font-size: 13px;
      width: 200px;
      flex-shrink: 0;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .bar-track {
      flex: 1;
      height: 8px;
      background: var(--border);
      border-radius: 4px;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      border-radius: 4px;
      transition: width 0.5s ease;
    }
    .bar-count {
      font-size: 13px;
      color: var(--muted);
      min-width: 60px;
      text-align: right;
      white-space: nowrap;
    }

    /* Couleurs barres */
    .bar-fort    { background: #22C55E; }
    .bar-partiel { background: #F59E0B; }
    .bar-non     { background: #EF4444; }
    .bar-role    { background: var(--accent); }

    /* Tableau récents */
    .recent-table { width: 100%; border-collapse: collapse; font-size: 14px; }
    .recent-table td { padding: 10px 0; border-bottom: 1px solid var(--border); vertical-align: middle; }
    .recent-table tr:last-child td { border-bottom: none; }
    .recent-table tr { cursor: pointer; transition: opacity 0.1s; }
    .recent-table tr:hover { opacity: 0.8; }

    @media (max-width: 600px) {
      .kpi-grid { grid-template-columns: 1fr; }
      .bar-label { width: 130px; font-size: 12px; }
      .bar-count { min-width: 40px; font-size: 12px; }
      .recent-col-role { display: none; }
      .recent-table td { padding: 8px 0; font-size: 13px; }
      .recent-table .recent-col-pl { padding-left: 8px; }
    }
  </style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <a href="list.html"><img src="logo.png?v=2" alt="Shyfters" class="brand-logo"></a>
  </div>
  <div class="topbar-right">
    <a href="list.html" class="btn btn-ghost btn-sm">← Rapports</a>
    <span class="user-badge" id="userEmail">—</span>
    <button class="btn btn-ghost btn-sm" id="logoutBtn">Déconnexion</button>
  </div>
</header>

<main class="page-inner">
  <div class="stats-wrap">

    <div class="list-header" style="margin-bottom:24px">
      <div>
        <div class="list-title">Tableau de bord</div>
        <div class="list-meta" id="statsMeta">Chargement…</div>
      </div>
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        <button class="filter-pill active period-pill" data-period="all">Tout</button>
        <button class="filter-pill period-pill" data-period="30d">30 jours</button>
        <button class="filter-pill period-pill" data-period="7d">7 jours</button>
      </div>
    </div>

    <!-- KPIs -->
    <div class="kpi-grid" id="kpiGrid" hidden>
      <div class="kpi-card">
        <div class="kpi-value" id="kpiTotal">—</div>
        <div class="kpi-label">Rapports au total</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-value cyan" id="kpiScore">—</div>
        <div class="kpi-label">Score moyen</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-value green" id="kpiFort">—</div>
        <div class="kpi-label">Fort match</div>
      </div>
    </div>

    <!-- Répartition recommandations -->
    <div class="stats-section" id="sectionRec" hidden>
      <div class="stats-section-title">Répartition des recommandations</div>
      <div id="recBars"></div>
    </div>

    <!-- Répartition par rôle -->
    <div class="stats-section" id="sectionRole" hidden>
      <div class="stats-section-title">Répartition par rôle CODIR</div>
      <div id="roleBars"></div>
    </div>

    <!-- Derniers rapports -->
    <div class="stats-section" id="sectionRecent" hidden>
      <div class="stats-section-title">5 derniers rapports</div>
      <table class="recent-table" id="recentTable"></table>
    </div>

  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js?v=1"></script>
<script src="auth.js?v=1"></script>
<script>
(async () => {
  const session = await requireAuth();
  if (!session) return;

  document.getElementById('userEmail').textContent = session.user.email;
  document.getElementById('logoutBtn').addEventListener('click', signOut);

  const meta = document.getElementById('statsMeta');

  const { data: allRapports, error } = await sb
    .from('rapports')
    .select('id, candidat_nom, score_global, recommandation, poste_vise, created_at')
    .order('created_at', { ascending: false });

  if (error || !allRapports) {
    meta.textContent = 'Erreur de chargement.';
    meta.style.color = 'var(--danger)';
    return;
  }

  if (allRapports.length === 0) {
    meta.textContent = 'Aucun rapport enregistré.';
    return;
  }

  // ── Helpers ──
  function badgeClass(r) { return r === 'fort' ? 'badge-fort' : r === 'partiel' ? 'badge-partiel' : 'badge-non'; }
  function badgeLabel(r) { return r === 'fort' ? 'Fort match' : r === 'partiel' ? 'Partiel' : 'Non-match'; }
  function fmtDate(iso)  { return new Date(iso).toLocaleDateString('fr-FR', { day:'2-digit', month:'short', year:'numeric' }); }
  function esc(s)        { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  // ── Filtre période ──
  let activePeriod = 'all';

  function filterByPeriod(rapports, period) {
    if (period === 'all') return rapports;
    const days = period === '7d' ? 7 : 30;
    const cutoff = new Date();
    cutoff.setDate(cutoff.getDate() - days);
    return rapports.filter(r => new Date(r.created_at) >= cutoff);
  }

  document.querySelectorAll('.period-pill').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.period-pill').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      activePeriod = btn.dataset.period;
      renderStats(filterByPeriod(allRapports, activePeriod));
    });
  });

  // ── Rendu ──
  function renderStats(rapports) {
    const total = rapports.length;
    const sections = ['kpiGrid','sectionRec','sectionRole','sectionRecent'];

    if (total === 0) {
      meta.textContent = 'Aucun rapport sur cette période.';
      sections.forEach(id => { document.getElementById(id).hidden = true; });
      return;
    }

    const periodLabel = activePeriod === '7d' ? '7 derniers jours'
                      : activePeriod === '30d' ? '30 derniers jours'
                      : 'toutes périodes';
    meta.textContent = `${total} rapport${total > 1 ? 's' : ''} — ${periodLabel}`;

    // KPIs
    const scores    = rapports.map(r => r.score_global).filter(s => s != null);
    const avgScore  = scores.length ? Math.round(scores.reduce((a, b) => a + b, 0) / scores.length) : 0;
    const fortCount = rapports.filter(r => r.recommandation === 'fort').length;
    const fortPct   = Math.round((fortCount / total) * 100);

    document.getElementById('kpiTotal').textContent = total;
    document.getElementById('kpiScore').textContent = avgScore + ' / 100';
    document.getElementById('kpiFort').textContent  = fortPct + '%';
    document.getElementById('kpiGrid').hidden = false;

    // Répartition recommandations
    const recDefs = [
      { key: 'fort',      label: 'Fort match', cls: 'bar-fort' },
      { key: 'partiel',   label: 'Partiel',    cls: 'bar-partiel' },
      { key: 'non-match', label: 'Non-match',  cls: 'bar-non' },
    ];
    const recBars = document.getElementById('recBars');
    recBars.innerHTML = '';
    recDefs.forEach(({ key, label, cls }) => {
      const count = rapports.filter(r => r.recommandation === key).length;
      const pct   = total ? Math.round((count / total) * 100) : 0;
      recBars.insertAdjacentHTML('beforeend', `
        <div class="bar-row">
          <span class="bar-label">${label}</span>
          <div class="bar-track"><div class="bar-fill ${cls}" style="width:${pct}%"></div></div>
          <span class="bar-count">${count} <span style="color:var(--muted);font-size:11px">(${pct}%)</span></span>
        </div>`);
    });
    document.getElementById('sectionRec').hidden = false;

    // Répartition par rôle
    const roleCount = {};
    rapports.forEach(r => {
      if (r.poste_vise) roleCount[r.poste_vise] = (roleCount[r.poste_vise] || 0) + 1;
    });
    const rolesSorted = Object.entries(roleCount).sort((a, b) => b[1] - a[1]);
    const maxRole = rolesSorted[0]?.[1] || 1;
    const roleBars = document.getElementById('roleBars');
    roleBars.innerHTML = '';
    rolesSorted.forEach(([role, count]) => {
      const pct = Math.round((count / maxRole) * 100);
      roleBars.insertAdjacentHTML('beforeend', `
        <div class="bar-row">
          <span class="bar-label" title="${role}">${role}</span>
          <div class="bar-track"><div class="bar-fill bar-role" style="width:${pct}%"></div></div>
          <span class="bar-count">${count}</span>
        </div>`);
    });
    document.getElementById('sectionRole').hidden = false;

    // 5 derniers rapports
    const table = document.getElementById('recentTable');
    table.innerHTML = '';
    rapports.slice(0, 5).forEach(r => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td><strong>${esc(r.candidat_nom)}</strong></td>
        <td class="text-muted recent-col-role recent-col-pl">${esc(r.poste_vise)}</td>
        <td class="recent-col-pl"><span class="badge ${badgeClass(r.recommandation)}">${badgeLabel(r.recommandation)}</span></td>
        <td class="text-muted" style="text-align:right">${fmtDate(r.created_at)}</td>`;
      tr.addEventListener('click', () => { window.location.href = `rapport.html?id=${r.id}`; });
      table.appendChild(tr);
    });
    document.getElementById('sectionRecent').hidden = false;
  }

  renderStats(allRapports);
})();
</script>

</body>
</html>
