<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shyfters Matching — Rapports</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="styles.css?v=2">
</head>
<body>

<!-- Barre de navigation -->
<header class="topbar">
  <div class="brand">
    <a href="list.html"><img src="logo.png?v=2" alt="Shyfters" class="brand-logo"></a>
  </div>
  <div class="topbar-right">
    <a href="stats.html" class="btn btn-ghost btn-sm">📊 Stats</a>
    <span class="user-badge" id="userEmail">—</span>
    <button class="btn btn-ghost btn-sm" id="logoutBtn">Déconnexion</button>
  </div>
</header>

<!-- Contenu principal -->
<main class="page-inner">

  <div class="list-header">
    <div>
      <div class="list-title">Rapports de matching</div>
      <div class="list-meta" id="listMeta">Chargement…</div>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn btn-ghost btn-sm" id="csvBtn" style="width:auto" hidden>
        ↓ CSV
      </button>
      <button class="btn btn-ghost btn-sm" id="syncBtn" style="width:auto;color:var(--accent);border-color:var(--accent)">
        ↓ Sync GitHub
      </button>
      <button class="btn btn-primary btn-sm" id="newBtn" style="width:auto">
        + Nouveau rapport
      </button>
    </div>
  </div>

  <!-- Panel sync GitHub -->
  <div id="syncPanel" hidden>
    <div class="sync-panel">
      <div class="sync-panel-header">
        <div class="sync-panel-title">↓ Rapports depuis GitHub</div>
        <button class="btn btn-ghost btn-sm" id="syncClose">✕</button>
      </div>
      <div id="syncContent"></div>
    </div>
  </div>

  <!-- Filtres -->
  <div id="filtersBar" hidden style="display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:16px">
    <input type="text" id="searchInput" placeholder="Rechercher un candidat, un client…"
      style="flex:1;min-width:200px;max-width:320px">
    <div style="display:flex;gap:6px;flex-wrap:wrap" id="recFilters">
      <button class="filter-pill active" data-rec="">Tous</button>
      <button class="filter-pill" data-rec="fort">Fort match</button>
      <button class="filter-pill" data-rec="partiel">Partiel</button>
      <button class="filter-pill" data-rec="non-match">Non-match</button>
    </div>
    <select id="roleFilter" style="max-width:220px">
      <option value="">Tous les rôles</option>
      <option>Directeur Général</option>
      <option>Directeur Marketing Digital</option>
      <option>Directeur Commercial</option>
      <option>Directeur Value Chain</option>
      <option>Directeur Finance et Juridique</option>
      <option>Directeur Ressources Humaines</option>
      <option>Directeur Systèmes d'Information</option>
    </select>
  </div>

  <!-- Tableau (caché si vide) -->
  <div class="table-wrap" id="tableWrap" hidden>
    <table>
      <thead>
        <tr>
          <th class="th-sort" data-col="candidat_nom">Candidat <span class="sort-arrow">↕</span></th>
          <th class="th-sort" data-col="poste_vise">Poste visé <span class="sort-arrow">↕</span></th>
          <th class="th-sort" data-col="client">Client <span class="sort-arrow">↕</span></th>
          <th class="th-sort" data-col="score_global">Score <span class="sort-arrow">↕</span></th>
          <th class="th-sort" data-col="recommandation">Recommandation <span class="sort-arrow">↕</span></th>
          <th class="th-sort sort-active" data-col="created_at">Date <span class="sort-arrow">↓</span></th>
          <th class="th-sort" data-col="auteur">Auteur <span class="sort-arrow">↕</span></th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

  <!-- État vide -->
  <div class="empty-state" id="emptyState" hidden>
    <div class="empty-state-icon">📋</div>
    <div class="empty-state-title">Aucun rapport pour l'instant</div>
    <p class="text-muted text-small mt-8">
      Analysez un profil dans Claude, puis cliquez sur « Nouveau rapport » pour enregistrer le résultat.
    </p>
  </div>

</main>

<div class="toast-container" id="toastContainer"></div>

<!-- Supabase CDN -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js?v=1"></script>
<script src="auth.js?v=1"></script>
<script>
(async () => {
  const session = await requireAuth();
  if (!session) return;

  document.getElementById('userEmail').textContent = session.user.email;
  document.getElementById('logoutBtn').addEventListener('click', signOut);
  document.getElementById('newBtn').addEventListener('click', () => { window.location.href = 'new.html'; });

  const meta        = document.getElementById('listMeta');
  const tableWrap   = document.getElementById('tableWrap');
  const emptyState  = document.getElementById('emptyState');
  const filtersBar  = document.getElementById('filtersBar');
  const tbody       = document.getElementById('tableBody');
  const searchInput = document.getElementById('searchInput');
  const roleFilter  = document.getElementById('roleFilter');

  // ── Toast ──
  function showToast(msg, type = 'success', duration = 3000) {
    const container = document.getElementById('toastContainer');
    const t = document.createElement('div');
    t.className = `toast toast-${type}`;
    t.textContent = msg;
    container.appendChild(t);
    setTimeout(() => t.remove(), duration);
  }

  // ── Export CSV ──
  function exportCSV() {
    const cols    = ['candidat_nom','poste_vise','score_global','recommandation','client','created_at'];
    const headers = ['Nom','Rôle','Score','Recommandation','Client','Date'];
    const rows = rapports.map(r => cols.map(c => {
      let v = r[c] ?? '';
      if (c === 'created_at') v = new Date(v).toLocaleDateString('fr-FR');
      return `"${String(v).replace(/"/g, '""')}"`;
    }));
    const csv  = [headers.join(','), ...rows.map(r => r.join(','))].join('\n');
    const blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' });
    const a = Object.assign(document.createElement('a'), {
      href: URL.createObjectURL(blob),
      download: `shyfters-rapports-${new Date().toISOString().slice(0,10)}.csv`,
    });
    a.click();
    showToast(`${rapports.length} rapport${rapports.length > 1 ? 's' : ''} exporté${rapports.length > 1 ? 's' : ''} en CSV`, 'info');
  }

  document.getElementById('csvBtn').addEventListener('click', exportCSV);

  // Charger les rapports
  const { data: rapports, error } = await sb
    .from('rapports')
    .select('id, candidat_nom, poste_vise, client, score_global, recommandation, created_at, analysis_filename, profiles(nom)')
    .order('created_at', { ascending: false });

  if (error) {
    meta.textContent = 'Erreur lors du chargement des rapports.';
    meta.style.color = 'var(--danger)';
    emptyState.hidden = false;
    return;
  }

  if (!rapports || rapports.length === 0) {
    meta.textContent = '0 rapport';
    emptyState.hidden = false;
    return;
  }

  // Helpers
  function esc(str) {
    if (!str) return '—';
    return String(str)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }
  function scoreClass(s) { return s >= 70 ? 'score-high' : s >= 45 ? 'score-mid' : 'score-low'; }
  function badgeClass(r) { return r === 'fort' ? 'badge-fort' : r === 'partiel' ? 'badge-partiel' : 'badge-non'; }
  function badgeLabel(r) { return r === 'fort' ? 'Fort match' : r === 'partiel' ? 'Partiel' : 'Non-match'; }
  function fmtDate(iso)  { return new Date(iso).toLocaleDateString('fr-FR', { day:'2-digit', month:'short', year:'numeric' }); }
  function norm(str) {
    return (str || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  }

  function levenshtein(a, b) {
    const m = a.length, n = b.length;
    const prev = Array.from({length: n + 1}, (_, j) => j);
    const curr = new Array(n + 1);
    for (let i = 1; i <= m; i++) {
      curr[0] = i;
      for (let j = 1; j <= n; j++) {
        curr[j] = a[i-1] === b[j-1]
          ? prev[j-1]
          : 1 + Math.min(prev[j], curr[j-1], prev[j-1]);
      }
      prev.splice(0, n + 1, ...curr);
    }
    return prev[n];
  }

  function fuzzyMatch(query, target) {
    if (!query) return true;
    if (target.includes(query)) return true;
    if (query.length < 4) return false;
    const qWords = query.split(/\s+/).filter(Boolean);
    const tWords = target.split(/\s+/).filter(Boolean);
    const threshold = w => w.length <= 5 ? 1 : 2;
    return qWords.every(qw =>
      target.includes(qw) ||
      tWords.some(tw => levenshtein(qw, tw) <= threshold(qw))
    );
  }

  // État des filtres + tri
  let activeRec  = '';
  let activeRole = '';
  let searchTerm = '';
  let sortCol = 'created_at';
  let sortDir = 'desc';

  const REC_ORDER = { fort: 0, partiel: 1, 'non-match': 2 };

  function getSortValue(r, col) {
    switch (col) {
      case 'candidat_nom':  return (r.candidat_nom  || '').toLowerCase();
      case 'poste_vise':    return (r.poste_vise    || '').toLowerCase();
      case 'client':        return (r.client        || '').toLowerCase();
      case 'score_global':  return r.score_global   ?? 0;
      case 'recommandation':return REC_ORDER[r.recommandation] ?? 3;
      case 'created_at':    return r.created_at     || '';
      case 'auteur':        return (r.profiles?.nom || '').toLowerCase();
      default:              return '';
    }
  }

  function updateSortHeaders() {
    document.querySelectorAll('.th-sort').forEach(th => {
      const active = th.dataset.col === sortCol;
      th.classList.toggle('sort-active', active);
      th.querySelector('.sort-arrow').textContent = active ? (sortDir === 'asc' ? '↑' : '↓') : '↕';
    });
  }

  function applyFilters() {
    const term = norm(searchTerm);
    const filtered = rapports.filter(r => {
      const haystack = norm(r.candidat_nom) + ' ' + norm(r.client || '');
      const matchSearch = !term || fuzzyMatch(term, haystack);
      const matchRec  = !activeRec  || r.recommandation === activeRec;
      const matchRole = !activeRole || r.poste_vise === activeRole;
      return matchSearch && matchRec && matchRole;
    });

    filtered.sort((a, b) => {
      const va = getSortValue(a, sortCol);
      const vb = getSortValue(b, sortCol);
      if (va < vb) return sortDir === 'asc' ? -1 : 1;
      if (va > vb) return sortDir === 'asc' ?  1 : -1;
      return 0;
    });

    tbody.innerHTML = '';

    if (filtered.length === 0) {
      tableWrap.hidden = true;
      emptyState.hidden = false;
      document.querySelector('.empty-state-title').textContent = 'Aucun résultat';
      document.querySelector('.empty-state p').textContent = 'Modifiez vos filtres pour voir des rapports.';
      meta.textContent = '0 résultat';
      return;
    }

    emptyState.hidden = true;
    tableWrap.hidden  = false;
    meta.textContent  = `${filtered.length} rapport${filtered.length > 1 ? 's' : ''}${filtered.length < rapports.length ? ` (sur ${rapports.length})` : ''}`;

    filtered.forEach(r => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td><strong>${esc(r.candidat_nom)}</strong></td>
        <td class="text-muted">${esc(r.poste_vise)}</td>
        <td class="text-muted">${esc(r.client)}</td>
        <td><span class="score-pill ${scoreClass(r.score_global)}">${r.score_global}</span></td>
        <td><span class="badge ${badgeClass(r.recommandation)}">${badgeLabel(r.recommandation)}</span></td>
        <td class="text-muted">${fmtDate(r.created_at)}</td>
        <td class="text-muted">${esc(r.profiles?.nom)}</td>
      `;
      tr.addEventListener('click', () => { window.location.href = `rapport.html?id=${r.id}`; });
      tbody.appendChild(tr);
    });
  }

  // Affichage initial
  meta.textContent = `${rapports.length} rapport${rapports.length > 1 ? 's' : ''}`;
  tableWrap.hidden = false;
  filtersBar.hidden = false;
  filtersBar.style.display = 'flex';
  document.getElementById('csvBtn').hidden = false;
  applyFilters();

  // Événements filtres
  searchInput.addEventListener('input', () => { searchTerm = searchInput.value; applyFilters(); });
  roleFilter.addEventListener('change',  () => { activeRole = roleFilter.value;  applyFilters(); });

  document.querySelectorAll('.filter-pill').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.filter-pill').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      activeRec = btn.dataset.rec;
      applyFilters();
    });
  });

  // Tri par colonne
  document.querySelectorAll('.th-sort').forEach(th => {
    th.addEventListener('click', () => {
      const col = th.dataset.col;
      if (sortCol === col) {
        sortDir = sortDir === 'asc' ? 'desc' : 'asc';
      } else {
        sortCol = col;
        sortDir = col === 'score_global' ? 'desc' : 'asc';
      }
      updateSortHeaders();
      applyFilters();
    });
  });

  // ── Sync GitHub ──
  const REPO           = 'atheenais/shyftersmatching';
  const GH_API         = `https://api.github.com/repos/${REPO}/contents/reports`;
  const ROLES_VALIDES  = [
    'Directeur Général','Directeur Marketing Digital','Directeur Commercial',
    'Directeur Value Chain','Directeur Finance et Juridique',
    'Directeur Ressources Humaines',"Directeur Systèmes d'Information"
  ];

  const syncPanel   = document.getElementById('syncPanel');
  const syncContent = document.getElementById('syncContent');

  // Source de vérité partagée entre appareils : les rapports déjà présents dans Supabase.
  // On déduit les fichiers déjà importés via la colonne analysis_filename (et non le localStorage,
  // qui est propre à chaque navigateur et réaffichait donc tout sur un nouvel appareil).
  async function getImportedFromDB() {
    const { data, error } = await sb.from('rapports').select('analysis_filename');
    if (error) { console.warn('getImportedFromDB', error); return new Set(); }
    return new Set((data || []).map(r => r.analysis_filename).filter(Boolean));
  }

  function fmtGHName(name) {
    return name.replace(/^matching_/, '').replace(/\.json$/, '').replace(/_/g, ' ');
  }

  document.getElementById('syncClose').addEventListener('click', () => { syncPanel.hidden = true; });

  document.getElementById('syncBtn').addEventListener('click', async () => {
    syncPanel.hidden = false;
    syncContent.innerHTML = '<div style="padding:14px 16px;color:var(--muted);font-size:13px">Chargement…</div>';

    let files = [];
    try {
      const res = await fetch(GH_API);
      if (res.status === 404) files = [];
      else if (!res.ok) throw new Error(`GitHub API : ${res.status}`);
      else files = await res.json();
    } catch(e) {
      syncContent.innerHTML = `<div style="padding:14px 16px;color:var(--danger);font-size:13px">Erreur : ${e.message}</div>`;
      return;
    }

    const imported = await getImportedFromDB();
    const newFiles = files.filter(f =>
      f.name.endsWith('.json') && !f.name.startsWith('_') && !imported.has(f.name)
    );

    if (newFiles.length === 0) {
      syncContent.innerHTML = '<div style="padding:14px 16px;color:var(--muted);font-size:13px">✓ Aucun nouveau rapport à importer.</div>';
      return;
    }

    syncContent.innerHTML = newFiles.map(f => `
      <div class="sync-file-row" id="row_${f.name.replace(/[^a-z0-9]/gi,'_')}">
        <span class="sync-file-name">${esc(fmtGHName(f.name))}</span>
        <button class="btn btn-primary btn-sm" style="width:auto;flex-shrink:0"
          data-url="${f.download_url}" data-name="${f.name}">Importer</button>
      </div>`).join('');

    syncContent.querySelectorAll('button[data-url]').forEach(btn => {
      btn.addEventListener('click', () => importGHFile(btn.dataset.url, btn.dataset.name, btn));
    });
  });

  async function importGHFile(url, name, btn) {
    btn.disabled = true;
    btn.textContent = 'Import…';

    let d;
    try {
      const res = await fetch(url);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      d = await res.json();
    } catch(e) {
      btn.disabled = false; btn.textContent = 'Réessayer';
      btn.style.cssText += ';background:var(--danger)';
      return;
    }

    // Validation des champs requis
    const missing = [];
    if (!d.name || typeof d.name !== 'string') missing.push('nom');
    if (typeof d.score !== 'number' || d.score < 0 || d.score > 100) missing.push('score');
    if (!['fort','partiel','non-match'].includes(d.verdict)) missing.push('verdict');
    if (missing.length) {
      btn.disabled = false;
      btn.textContent = '⚠ JSON invalide';
      btn.style.cssText += ';background:var(--danger)';
      btn.title = `Champs manquants ou invalides : ${missing.join(', ')}`;
      return;
    }

    const recommandation = d.verdict;
    const poste_vise     = ROLES_VALIDES.includes(d.role) ? d.role : 'Directeur Général';

    const payload = {
      candidat_nom:      d.name                  || 'Inconnu',
      poste_actuel:      d.title                 || null,
      poste_vise,
      client:            null,
      score_global:      typeof d.score === 'number' ? d.score : 0,
      recommandation,
      synthese:          d.recommendationDetail  || '',
      analysis_filename: name,
      detail_grille:     d,
      auteur_id:         session.user.id,
    };

    const { data: inserted, error } = await sb.from('rapports').insert([payload]).select().single();

    if (error) {
      btn.disabled = false; btn.textContent = 'Erreur — réessayer';
      btn.style.cssText += ';background:var(--danger)';
      return;
    }

    showToast(`✓ ${fmtGHName(name)} importé avec succès`, 'success');

    // Mise à jour visuelle de la ligne
    const row = document.getElementById('row_' + name.replace(/[^a-z0-9]/gi,'_'));
    row.innerHTML = `
      <span class="sync-file-name">${esc(fmtGHName(name))}</span>
      <a href="rapport.html?id=${inserted.id}" class="btn btn-ghost btn-sm"
        style="flex-shrink:0;color:var(--success);border-color:var(--success)">✓ Voir le rapport →</a>`;

    // Ajout du rapport dans la liste locale sans recharger
    rapports.unshift(inserted);
    meta.textContent = `${rapports.length} rapport${rapports.length > 1 ? 's' : ''}`;
    tableWrap.hidden = false;
    emptyState.hidden = true;
    applyFilters();
  }
})();
</script>

</body>
</html>
